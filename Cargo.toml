[package]
name = "saddle"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Federico Maria Morrone <contact@morrone.dev>"]
description = "Async seat managment made easy"
readme = "README.md"
documentation = "https://docs.rs/saddle"
repository = "https://github.com/verdiwm/saddle"
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
futures-util = { version = "0.3.30", default-features = false }
reconciler = "0.0.3"
zbus = { version = "5.2.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
anyhow = "1.0.94"
crossbeam = "0.8.4"
rustix = { version = "0.38.42", features = ["process", "fs"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "tracing-log",
] }
colpetto = { version = "0.0.3", path = "../colpetto" }
tokio-stream = "0.1.17"
tracing = "0.1.41"
